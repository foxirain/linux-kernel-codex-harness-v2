name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse"
          python -m pip install --force-reinstall "$RUNNER_TEMP"/wheelhouse/*.whl

      - name: Smoke test installed profiles and default scan
        run: |
          smoke_root="$RUNNER_TEMP/kernel-harness-smoke"
          mkdir -p "$smoke_root/tree/kernel" "$smoke_root/out"
          printf '%s\n' \
            'void *small(size_t n) { return kmalloc(n, GFP_KERNEL); }' \
            'void *large(size_t n) { return kvmalloc(n, GFP_KERNEL); }' \
            > "$smoke_root/tree/kernel/allocation.c"
          cd "$RUNNER_TEMP"
          python -c 'from kernel_harness.cli import PROFILE_CONFIGS; assert len(PROFILE_CONFIGS) == 6; assert all(path.is_file() for path in PROFILE_CONFIGS.values())'
          kernel-harness scan "$smoke_root/tree" \
            --profile default \
            --out "$smoke_root/out" \
            --limit 5 \
            --top 1 \
            | tee "$smoke_root/scan.txt"
          grep -q '^profile=default$' "$smoke_root/scan.txt"
          grep -q '^candidates=1$' "$smoke_root/scan.txt"
          session="$(find "$smoke_root/out" -maxdepth 1 -type d -name 'session-*' -print -quit)"
          test -n "$session"
          test -f "$session/targets.json"
